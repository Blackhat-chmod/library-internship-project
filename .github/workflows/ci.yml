
name: Week 7 CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/LibraryApi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore LibraryApi.Tests/LibraryApi.Tests.csproj

      - name: Build backend and tests
        run: dotnet build LibraryApi.Tests/LibraryApi.Tests.csproj --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test LibraryApi.Tests/LibraryApi.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

  angular:
    name: Angular Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/library-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/library-angular/package-lock.json

      - name: Install Angular dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

  python:
    name: Python Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install testing dependencies
        run: python -m pip install pytest respx

      - name: Run Python tests
        run: python -m pytest tests/ -v
