<h1>Library Management</h1>

<nav>
  <a routerLink="/">
    Book List
  </a>

  @if (authService.isLoggedIn()) {
    |
    <a routerLink="/add-book">
      Add Book
    </a>

    |
    <a routerLink="/assistant">
      AI Assistant
    </a>

    |

    <span>
      Role: {{ authService.getRole() }}
    </span>

    |

    <button (click)="logout()">
      Logout
    </button>
  } @else {
    |
    <a routerLink="/login">
      Login
    </a>
  }
</nav>

<hr>

<router-outlet></router-outlet>
